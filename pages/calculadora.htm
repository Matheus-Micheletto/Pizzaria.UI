<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <form class="row g-3 needs-validation" novalidate>
  <div class="col-md-4">
    <label for="numero2" class="form-label">Primeiro número</label>
    <input type="number" class="form-control" id="numero1" required>
    <div class="valid-feedback">
      Looks good!
    </div>
  </div>
  <div class="col-md-4">
    <label for="numero2" class="form-label">Segundo número</label>
    <input type="number" class="form-control" id="numero2" required>
    <div class="valid-feedback">
      Looks good!
    </div>
  </div>
  </div>
  <div class="col-md-3">
    <label for="operacao" class="form-label">Operação</label>
    <select class="form-select" id="operacao"  required>
      <option selected disabled value=""></option>
        <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>
    <div class="invalid-feedback">
      Selecione uma ação possível
    </div>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" id="calcular">Calcular</button>
  </div>
</form>
    <!--jQuery-->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!--Bootsrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--JS-->
    <script src="../js/calculadora.js"></script>
</body>
</html>
